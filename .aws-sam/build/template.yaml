AWSTemplateFormatVersion: '2010-09-09'
Description: enterprise-app-test
Transform:
- AWS::Serverless-2016-10-31
Parameters:
  Environment:
    Type: String
    Default: test
  DBUsername:
    Type: String
    Default: postgres
    NoEcho: true
  DBPassword:
    Type: String
    NoEcho: true
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-vpc
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-private-a
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-private-b
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS PostgreSQL
      SubnetIds:
      - Ref: PrivateSubnetA
      - Ref: PrivateSubnetB
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId:
        Ref: VPC
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId:
        Ref: VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
  PostgresInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: enterprise-app-${Environment}-db
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername:
        Ref: DBUsername
      MasterUserPassword:
        Ref: DBPassword
      DBName: enterprise_app
      VPCSecurityGroups:
      - Ref: DBSecurityGroup
      DBSubnetGroup:
        Ref: DBSubnetGroup
      PubliclyAccessible: false
      DeletionProtection: false
      BackupRetentionPeriod: 1
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: enterprise-app-${Environment}-users
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName:
        Fn::Sub: enterprise-app-${Environment}-app
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: enterprise-app-${Environment}-api
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
            Identity:
              Header: Authorization
  healthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: healthFunction
      Handler: dist/handlers/get-health.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Health endpoint Lambda function.
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: PrivateSubnetA
        - Ref: PrivateSubnetB
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - PostgresInstance
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - PostgresInstance
            - Endpoint.Port
          DB_NAME: enterprise_app
          DB_USERNAME:
            Ref: DBUsername
          DB_PASSWORD:
            Ref: DBPassword
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/health
            Method: GET
      Policies:
      - VPCAccessPolicy: {}
    Metadata:
      SamResourceId: healthFunction
  usersMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: usersMeFunction
      Handler: dist/handlers/get-users-me.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Returns the authenticated user's profile.
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/users/me
            Method: GET
    Metadata:
      SamResourceId: usersMeFunction
  signupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: signupFunction
      Handler: dist/handlers/post-auth-signup.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Sign up a new user via Cognito.
      Environment:
        Variables:
          COGNITO_CLIENT_ID:
            Ref: UserPoolClient
          COGNITO_USER_POOL_ID:
            Ref: UserPool
          COGNITO_ENDPOINT: ''
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:SignUp
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: signupFunction
  confirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: confirmFunction
      Handler: dist/handlers/post-auth-confirm.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Confirm a user's email with a Cognito code.
      Environment:
        Variables:
          COGNITO_CLIENT_ID:
            Ref: UserPoolClient
          COGNITO_USER_POOL_ID:
            Ref: UserPool
          COGNITO_ENDPOINT: ''
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:ConfirmSignUp
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: confirmFunction
  loginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: loginFunction
      Handler: dist/handlers/post-auth-login.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Authenticate a user and return tokens.
      Environment:
        Variables:
          COGNITO_CLIENT_ID:
            Ref: UserPoolClient
          COGNITO_USER_POOL_ID:
            Ref: UserPool
          COGNITO_ENDPOINT: ''
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:InitiateAuth
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: loginFunction
  refreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: refreshFunction
      Handler: dist/handlers/post-auth-refresh.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 10
      Description: Exchange a refresh token for a new access token.
      Environment:
        Variables:
          COGNITO_CLIENT_ID:
            Ref: UserPoolClient
          COGNITO_USER_POOL_ID:
            Ref: UserPool
          COGNITO_ENDPOINT: ''
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:InitiateAuth
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: refreshFunction
Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: UserPoolClient
  DBEndpoint:
    Description: RDS PostgreSQL endpoint
    Value:
      Fn::GetAtt:
      - PostgresInstance
      - Endpoint.Address
  DBPort:
    Description: RDS PostgreSQL port
    Value:
      Fn::GetAtt:
      - PostgresInstance
      - Endpoint.Port
