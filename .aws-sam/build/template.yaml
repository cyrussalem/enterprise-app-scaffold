AWSTemplateFormatVersion: '2010-09-09'
Description: enterprise-app-test
Transform:
- AWS::Serverless-2016-10-31
Parameters:
  Environment:
    Type: String
    Default: test
  DBUsername:
    Type: String
    Default: postgres
    NoEcho: true
  DBPassword:
    Type: String
    NoEcho: true
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-vpc
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-private-a
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: enterprise-app-${Environment}-private-b
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: VPC
      InternetGatewayId:
        Ref: InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId:
        Ref: InternetGateway
  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateSubnetA
      RouteTableId:
        Ref: PublicRouteTable
  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateSubnetB
      RouteTableId:
        Ref: PublicRouteTable
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS PostgreSQL
      SubnetIds:
      - Ref: PrivateSubnetA
      - Ref: PrivateSubnetB
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId:
        Ref: VPC
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId:
        Ref: VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp: '0.0.0.0/0'
  PostgresInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: VPCGatewayAttachment
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: enterprise-app-${Environment}-db
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername:
        Ref: DBUsername
      MasterUserPassword:
        Ref: DBPassword
      DBName: enterprise_app
      VPCSecurityGroups:
      - Ref: DBSecurityGroup
      DBSubnetGroupName:
        Ref: DBSubnetGroup
      PubliclyAccessible: true
      DeletionProtection: false
      BackupRetentionPeriod: 1
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: enterprise-app-${Environment}-users
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName:
        Fn::Sub: enterprise-app-${Environment}-app
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: enterprise-app-${Environment}-api
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
            Identity:
              Header: Authorization
  apiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/api.ts
        External:
        - pg-native
        - pg-hstore
        - mysql
        - mysql2
        - mariadb
        - mssql
        - tedious
        - oracledb
        - sqlite3
        - better-sqlite3
        Minify: false
        Sourcemap: false
        Target: node22
      SamResourceId: apiFunction
    Properties:
      CodeUri: apiFunction
      Handler: api.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 256
      Timeout: 100
      Description: Consolidated API Lambda. Routes all /v1/* endpoints.
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - PostgresInstance
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - PostgresInstance
            - Endpoint.Port
          DB_NAME: enterprise_app
          DB_USERNAME:
            Ref: DBUsername
          DB_PASSWORD:
            Ref: DBPassword
          DB_SSL: 'true'
          COGNITO_CLIENT_ID:
            Ref: UserPoolClient
          COGNITO_USER_POOL_ID:
            Ref: UserPool
          COGNITO_ENDPOINT: ''
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:SignUp
          - cognito-idp:ConfirmSignUp
          - cognito-idp:InitiateAuth
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/health
            Method: GET
        UsersMeApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/users/me
            Method: GET
        SignupApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
        ConfirmApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE
        LoginApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        RefreshApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE
        ListDevicesApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices
            Method: GET
        CreateDeviceApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices
            Method: POST
        GetDeviceApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices/{id}
            Method: GET
        UpdateDeviceApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices/{id}
            Method: PATCH
        DeleteDeviceApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices/{id}
            Method: DELETE
        IngestTelemetryApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices/{id}/telemetry
            Method: POST
        QueryTelemetryApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/devices/{id}/telemetry
            Method: GET
        DashboardSummaryApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/dashboard/summary
            Method: GET
        WhatsAppWebhookApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/whatsapp/webhook
            Method: POST
            Auth:
              Authorizer: NONE
Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: UserPoolClient
  DBEndpoint:
    Description: RDS PostgreSQL endpoint
    Value:
      Fn::GetAtt:
      - PostgresInstance
      - Endpoint.Address
  DBPort:
    Description: RDS PostgreSQL port
    Value:
      Fn::GetAtt:
      - PostgresInstance
      - Endpoint.Port
