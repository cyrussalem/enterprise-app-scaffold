AWSTemplateFormatVersion: 2010-09-09
Description: >-
  enterprise-app-test

Transform:
- AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: test
  DBUsername:
    Type: String
    Default: postgres
    NoEcho: true
  DBPassword:
    Type: String
    NoEcho: true

Resources:

  # ---- VPC & Networking ----

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub enterprise-app-${Environment}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub enterprise-app-${Environment}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub enterprise-app-${Environment}-private-b

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  # ---- Security Groups ----

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # ---- RDS PostgreSQL ----

  PostgresInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub enterprise-app-${Environment}-db
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: enterprise_app
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      DBSubnetGroup: !Ref DBSubnetGroup
      PubliclyAccessible: false
      DeletionProtection: false
      BackupRetentionPeriod: 1

  # ---- Cognito ----

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub enterprise-app-${Environment}-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub enterprise-app-${Environment}-app
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---- API with default Cognito authorizer ----

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub enterprise-app-${Environment}-api
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization

  # ---- Consolidated API Lambda ----
  # Single Lambda backs every route. An internal router in src/handlers/api.ts
  # dispatches by (httpMethod, resource) to the correct child handler.

  apiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: dist/handlers/api.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 100
      Description: Consolidated API Lambda. Routes all /v1/* endpoints.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DB_HOST: !GetAtt PostgresInstance.Endpoint.Address
          DB_PORT: !GetAtt PostgresInstance.Endpoint.Port
          DB_NAME: enterprise_app
          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_ENDPOINT: ""
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:InitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/health
            Method: GET
        UsersMeApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/users/me
            Method: GET
        SignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
        ConfirmApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        RefreshApi:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref UserPoolClient
  DBEndpoint:
    Description: "RDS PostgreSQL endpoint"
    Value: !GetAtt PostgresInstance.Endpoint.Address
  DBPort:
    Description: "RDS PostgreSQL port"
    Value: !GetAtt PostgresInstance.Endpoint.Port
